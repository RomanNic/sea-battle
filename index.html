<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Морской Бой</title>
    <style>
        body { background: #2c3e50; color: white; text-align: center; font-family: sans-serif; }
        .game-wrapper { display: flex; justify-content: center; gap: 40px; margin-top: 20px; }
        .grid { 
            display: grid; grid-template-columns: repeat(10, 30px); 
            grid-template-rows: repeat(10, 30px); gap: 2px; 
            background: #34495e; padding: 5px; border: 2px solid white;
        }
        .cell { width: 30px; height: 30px; background: #3498db; cursor: pointer; }
        .cell.hit { background: #e74c3c !important; }
        .cell.miss { background: #95a5a6 !important; }
        .cell.ship { background: #2ecc71; }
        #status { font-size: 24px; color: #f1c40f; margin: 20px; height: 30px; }
        button { padding: 10px 20px; font-size: 18px; cursor: pointer; background: #2ecc71; border: none; color: white; border-radius: 5px; }
    </style>
</head>
<body>

    <h1>МОРСКОЙ БОЙ</h1>
    <div id="status">Нажмите "Начать заново"</div>

    <div class="game-wrapper">
        <div>
            <h3>Ваше поле</h3>
            <div id="player-board" class="grid"></div>
        </div>
        <div>
            <h3>Поле врага</h3>
            <div id="enemy-board" class="grid"></div>
        </div>
    </div>

    <br>
    <button onclick="startGame()">Начать заново</button>

    <script>
        const SIZE = 10;
        const SHIP_COUNT = 5;
        let enemyShips = [];
        let playerShips = [];
        let gameOver = false;

        function startGame() {
            gameOver = false;
            enemyShips = [];
            playerShips = [];
            document.getElementById('status').innerText = "Ваш ход!";
            
            // Генерируем корабли
            for(let i=0; i<SHIP_COUNT; i++) {
                enemyShips.push({r: Math.floor(Math.random()*SIZE), c: Math.floor(Math.random()*SIZE)});
                playerShips.push({r: Math.floor(Math.random()*SIZE), c: Math.floor(Math.random()*SIZE)});
            }

            render('player-board', true);
            render('enemy-board', false);
        }

        function render(id, isPlayer) {
            const board = document.getElementById(id);
            board.innerHTML = '';
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.r = r;
                    cell.dataset.c = c;
                    
                    if (isPlayer) {
                        if (playerShips.some(s => s.r === r && s.c === c)) cell.classList.add('ship');
                    } else {
                        cell.onclick = () => shoot(r, c, cell);
                    }
                    board.appendChild(cell);
                }
            }
        }

        function shoot(r, c, cell) {
            if (gameOver || cell.classList.contains('hit') || cell.classList.contains('miss')) return;

            const hit = enemyShips.some(s => s.r === r && s.c === c);
            if (hit) {
                cell.classList.add('hit');
                document.getElementById('status').innerText = "ПОПАЛ!";
                if (document.querySelectorAll('#enemy-board .hit').length === SHIP_COUNT) {
                    document.getElementById('status').innerText = "ВЫ ПОБЕДИЛИ!";
                    gameOver = true;
                } else {
                    setTimeout(enemyTurn, 500);
                }
            } else {
                cell.classList.add('miss');
                document.getElementById('status').innerText = "МИМО!";
                setTimeout(enemyTurn, 500);
            }
        }

        function enemyTurn() {
            if (gameOver) return;
            let r, c, cell;
            let attempts = 0;
            do {
                r = Math.floor(Math.random()*SIZE);
                c = Math.floor(Math.random()*SIZE);
                cell = document.querySelector(#player-board [data-r=&quot;${r}&quot;][data-c=&quot;${c}&quot;]);
                attempts++;
            } while ((cell.classList.contains('hit') || cell.classList.contains('miss')) && attempts < 100);

            const hit = playerShips.some(s => s.r === r && s.c === c);
            if (hit) {
                cell.classList.add('hit');
                document.getElementById('status').innerText = "Компьютер попал!";
                setTimeout(enemyTurn, 500);
            } else {
                cell.classList.add('miss');
                document.getElementById('status').innerText = "Ваш ход!";
            }

            if (document.querySelectorAll('#player-board .hit').length === SHIP_COUNT) {
                document.getElementById('status').innerText = "ВЫ ПРОИГРАЛИ!";
                gameOver = true;
            }
        }

        // Запуск при загрузке
        window.onload = startGame;
    </script>
</body>
</html>
